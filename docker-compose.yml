
services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - api


  redis:
    image: redis:6.2-alpine

  db:

    image: postgres:13
    environment:
      - POSTGRES_DB=gputelemetry
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gputelemetry"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api:
    build: ./backend
    deploy:
      replicas: 3
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./backend:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  producer:
    build: ./backend
    depends_on:
      - kafka
    command: python -m app.producer

  consumer:
    build: ./backend
    depends_on:
      - kafka
      - db
    command: python -m app.consumer

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  postgres_data:
  kafka_data:

